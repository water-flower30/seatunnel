env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      fields {
        c_map = "map<string, string>"
        c_array = "array<int>"
        c_string = string
        c_boolean = boolean
        c_tinyint = tinyint
        c_smallint = smallint
        c_int = int
        c_bigint = bigint
        c_float = float
        c_double = double
        c_bytes = bytes
        c_date = date
        c_decimal = "decimal(38, 18)"
        c_timestamp = timestamp
      }
    }
  }
}

sink {
  AbfsFile {
    account_name = "your-account-name"
    account_key = "your-account-key"
    container = "your-container"
    path = "abfs://your-container@your-account-name.dfs.core.windows.net/tmp/seatunnel/json"
    file_format_type = "json"
  }
}
